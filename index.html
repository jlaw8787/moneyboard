  const em=($('#aEmail')||{}).value,pw=($('#aPass')||{}).value,err=$('#aErr'),go=$('#aGo');err.textContent='';
  if(AM!=='reset'&&!/^\S+@\S+\.\S+$/.test(em||'')){err.textContent='Enter a valid email address.';return}
  if(AM!=='forgot'&&(pw||'').length<6){err.textContent='Password needs at least 6 characters.';return}
  go.disabled=true;go.textContent='Please wait';const back=location.origin+location.pathname;
  try{
    if(AM==='in'){const {error}=await SB.client.auth.signInWithPassword({email:em.trim(),password:pw});if(error)throw error;$('#authModal').classList.remove('open')}
    else if(AM==='up'){const {data,error}=await SB.client.auth.signUp({email:em.trim(),password:pw,options:{emailRedirectTo:back}});if(error)throw error;
      if(data.session)$('#authModal').classList.remove('open');else $('#authForm').innerHTML='<div class="authok">Check your email and click the link to confirm your account, then sign in.</div>'}
    else if(AM==='forgot'){const {error}=await SB.client.auth.resetPasswordForEmail(em.trim(),{redirectTo:back});if(error)throw error;$('#authForm').innerHTML='<div class="authok">If that email has an account, a reset link is on its way.</div>'}
    else{const {error}=await SB.client.auth.updateUser({password:pw});if(error)throw error;$('#authModal').classList.remove('open');history.replaceState(null,'',back);toast('Password updated','You are signed in','good')}
  }catch(e){const m=String(e&&e.message||'');err.textContent=/invalid login/i.test(m)?'Email or password is not right.':/already registered/i.test(m)?'That email already has an account. Try signing in.':/rate limit/i.test(m)?'Too many attempts. Wait a minute and try again.':m||'Something went wrong. Try again.';if(go.isConnected){go.disabled=false;go.textContent={in:'Sign in',up:'Create account',forgot:'Send reset link',reset:'Save password'}[AM]}}
}
async function signOut(){
  if((S.savedAt||0)>(S.syncAt||0))await pushNow();
  await pushUnsubscribe();await SB.client.auth.signOut();SB.user=null;S=fresh();S.flags.welcomed=true;S.flags.since=Date.now();lastSig=sig();store();setSync('off');render();
  toast('Signed out','Your data is safe in your account and has been removed from this device','info');
}

/* ============ Events ============ */
document.addEventListener('click',e=>{
  if(!e.target.closest('#npanel')&&!e.target.closest('[data-act="bell"]'))$('#npanel').classList.remove('open');
  if(!e.target.closest('[data-act="more"]'))$('#msheet').classList.remove('open');
  const gi=e.target.closest('#gIcon button');if(gi){document.querySelectorAll('#gIcon button').forEach(x=>x.classList.toggle('on',x===gi));return}
  const ft=e.target.closest('[data-ft]');if(ft){F.type=ft.dataset.ft;document.querySelectorAll('[data-ft]').forEach(b=>b.classList.toggle('on',b===ft));renderTxList();return}
  const fq=e.target.closest('#wFreq [data-f],#iFreq [data-f]');if(fq){const box=fq.parentElement;box.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b===fq));if(box.id==='wFreq'){W.f=fq.dataset.f;$('#wConv').innerHTML=convText(parseAmt($('#wAmt').value),W.f);$('#wAmt').focus()}else{IM.f=fq.dataset.f;$('#iConv').innerHTML=convText(parseAmt($('#iAmt').value),IM.f)}return}
  const pr=e.target.closest('[data-per]');if(pr){S.period=pr.dataset.per;save();render(true);return}
  if(e.target.id==='wiz'){wizClose();return}
  if(e.target.id==='ach'){closeAch();return}
  if(e.target.id==='itemModal'){$('#itemModal').classList.remove('open');return}
  if(e.target.id==='authModal'&&!CONF){$('#authModal').classList.remove('open');return}
  const el=e.target.closest('[data-act]');if(!el)return;const a=el.dataset.act;
  if(a==='wizOpen'){wizOpen();return}
  if(a==='welcomeFresh'){S.flags.welcomed=true;$('#welcome').classList.remove('open');S.view='budgets';save();render();return}
  if(a==='welcomeDemo'){const fl=S.flags;S=fresh();S.flags=Object.assign(fl,{welcomed:true,sample:true});seed();checkAlerts(true);evalChallenges(true);save();$('#welcome').classList.remove('open');render();toast('Sample data loaded','Clear it any time in Settings when you are ready to start','info');return}
  if(a==='account'){if(SB.user){S.view='settings';save();render();scrollTo({top:0})}else authOpen('in');return}
  if(a==='authOpen'){authOpen(el.dataset.mode||'in');return}
  if(a==='welcomeSignIn'){S.flags.welcomed=true;$('#welcome').classList.remove('open');save();authOpen('in');return}
  if(a==='authClose'){$('#authModal').classList.remove('open');return}
  if(a==='confCloud'&&CONF){$('#authModal').classList.remove('open');adopt(CONF.d,CONF.at);CONF=null;toast('Account data loaded','','good');return}
  if(a==='confLocal'&&CONF){$('#authModal').classList.remove('open');S.syncUid=SB.user.id;S.syncAt=CONF.at;CONF=null;pushNow();toast('This device\'s data saved to your account','','good');return}
  if(a==='syncNow'){pull();return}
  if(a==='signOut'){signOut();return}
  if(a==='snooze'){S.flags.snooze=Date.now()+3*DAY;save();render(true);return}
  if(a==='install'&&installEvt){installEvt.prompt();installEvt.userChoice.finally(()=>{installEvt=null;render(true)});return}
  if(a==='ruleDel'){const r=(S.rules||[]).find(x=>x.id===el.dataset.id);S.rules=S.rules.filter(x=>x.id!==el.dataset.id);save();render(true);if(r)toast('Rule removed',r.match,'info');return}
  if(a==='more'){$('#msheet').classList.toggle('open');return}
  if(a==='txEdit'){openModal('edit',el.dataset.id);return}
  if(a==='alertsOn'){if(!('Notification' in window))return;Notification.requestPermission().then(async p=>{S.settings.phoneAlerts=p==='granted';save();
    if(p!=='granted'){$('#remindCard').innerHTML=remindCard();toast('Alerts not allowed','You can change this in your browser settings','warn');return}
    const closed=await pushSubscribe();$('#remindCard').innerHTML=remindCard();
    toast('Phone alerts on',closed?'You will get bill alerts even when the app is closed':'You will get a pop-up when a bill is close','good');sysNotify('Phone alerts are on','Bill reminders will show up like this','test')});return}
  if(a==='alertsOff'){S.settings.phoneAlerts=false;save();pushUnsubscribe().then(()=>{$('#remindCard').innerHTML=remindCard()});return}
  if(a==='alertsTest'){if(pushOn()&&SB.client){el.disabled=true;SB.client.functions.invoke('bill-reminders',{body:{test:true}}).then(({data,error})=>{el.disabled=false;if(error||!data||!data.sent)toast('Test did not go through','Turn alerts off and on again, then retry','warn');else toast('Test sent','It can take a few seconds to arrive','good')})}else sysNotify('Test alert','Bill reminders will show up like this','test');return}
  if(a==='recNew'){openModal('new');$('#fRepeat').value='monthly';return}
  if(a==='recEdit'){openModal('rule',el.dataset.id);return}
  if(a==='recDel'){const r=S.recurring.find(x=>x.id===el.dataset.id);S.recurring=S.recurring.filter(x=>x.id!==el.dataset.id);save();render(true);if(r)toast('Stopped repeating '+(r.note||r.cat),'Past transactions are kept','info');return}
  if(a==='fDel'){$('#modal').classList.remove('open');if(MM.mode==='rule'){const r=S.recurring.find(x=>x.id===MM.id);S.recurring=S.recurring.filter(x=>x.id!==MM.id);save();render(true);if(r)toast('Stopped repeating '+(r.note||r.cat),'Past transactions are kept','info')}else{delTx(MM.id);save();render(true);toast('Transaction deleted','','info')}return}
  if(a==='achClose'){closeAch();return}
  if(a==='mission'){const m=MISSIONS.find(x=>x.id===el.dataset.id);if(m.act==='add')openModal();else{S.view=m.view;if(m.id==='budget')completeMission('budget',el);save();render();scrollTo({top:0})}return}
  if(a==='wizNext'){wizGo(W.i+1,true);return}
  if(a==='wizSkip'){wizGo(W.i+1,false);return}
  if(a==='wizBack'){wizGo(W.i-1,W.i<WIZ.length);return}
  if(a==='wizJump'){wizGo(+el.dataset.i,true);return}
  if(a==='wizClose'){wizClose();return}
  if(a==='wizDone'){S.flags.setup=true;$('#wiz').classList.remove('open');S.view='budgets';checkAlerts();evalChallenges();save();render();return}
  if(a==='toggleCat'){const c=el.dataset.cat;OPEN.has(c)?OPEN.delete(c):OPEN.add(c);render(true);return}
  if(a==='itemNew'){itemOpen(null,el.dataset.cat);return}
  if(a==='itemEdit'){itemOpen(el.dataset.id);return}
  if(a==='itemClose'){$('#itemModal').classList.remove('open');return}
  if(a==='itemDel'){const it=S.items.find(x=>x.id===el.dataset.id);S.items=S.items.filter(x=>x.id!==el.dataset.id);commit();if(it)toast('Removed '+it.name,'','info');return}
  if(a==='nav'){S.view=el.dataset.view;if(S.view==='budgets')completeMission('budget');save();render();scrollTo({top:0})}
  else if(a==='add')openModal();
  else if(a==='closeModal')$('#modal').classList.remove('open');
  else if(a==='month'){S.month=shiftYM(S.month,+el.dataset.n);save();render()}
  else if(a==='bell'){const p=$('#npanel');p.classList.toggle('open');if(p.classList.contains('open'))renderNotifs()}
  else if(a==='readAll'){S.notifs.forEach(n=>n.read=true);save();renderTop()}
  else if(a==='delTx'){delTx(el.dataset.id);save();render(true);toast('Transaction deleted','','info')}
  else if(a==='contrib'){const amt=el.dataset.amt?+el.dataset.amt:parseFloat(($('#c_'+el.dataset.id)||{}).value);contribute(el.dataset.id,amt,el)}
  else if(a==='delGoal'){if(el.dataset.armed){S.goals=S.goals.filter(g=>g.id!==el.dataset.id);save();render()}else{el.dataset.armed=1;el.style.width='auto';el.style.padding='0 8px';el.style.color='var(--neg)';el.textContent='Delete?';setTimeout(()=>{if(el.isConnected){delete el.dataset.armed;el.removeAttribute('style');el.innerHTML=ic('x',14)}},3000)}}
  else if(a==='export'){
    const data=JSON.stringify(S,null,1);
    try{const u=URL.createObjectURL(new Blob([data],{type:'application/json'})),l=document.createElement('a');l.href=u;l.download='moneyboard-backup-'+iso(new Date())+'.json';document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),2000)}catch(err){}
    try{navigator.clipboard.writeText(data).then(()=>toast('Backup exported','Downloaded and copied to your clipboard','good'),()=>toast('Backup exported','The backup text is shown below','good'))}catch(err){toast('Backup exported','The backup text is shown below','good')}
    S.flags.backup=true;S.flags.backupAt=Date.now();commit();const b=$('#exportBox');if(b){b.style.display='block';b.value=data}
  }
  else if(a==='demo'){const keep={xp:S.xp,unlocked:S.unlocked,settings:S.settings,notifs:S.notifs};S=Object.assign(fresh(),keep,{syncUid:S.syncUid,syncAt:S.syncAt});S.flags.welcomed=true;S.flags.sample=true;seed();S.view='dashboard';checkAlerts(true);evalChallenges(true);save();render();toast('Sample data loaded','','info')}
  else if(a==='clear'){if(el.dataset.armed){S=Object.assign(fresh(),{syncUid:S.syncUid,syncAt:S.syncAt});S.flags.welcomed=true;S.flags.since=Date.now();save();render();toast('All data cleared','Add your first transaction to begin','info')}else{el.dataset.armed=1;el.querySelector('span').textContent='Click again to confirm';setTimeout(()=>{if(el.isConnected){delete el.dataset.armed;el.querySelector('span').textContent='Clear all data'}},4000)}}
});
document.addEventListener('input',e=>{const t=e.target;
  if(t.id==='fq'){F.q=t.value;renderTxList()}
  else if(t.id==='wAmt'){$('#wConv').innerHTML=convText(parseAmt(t.value),W.f)}
  else if(t.id==='iAmt'){$('#iConv').innerHTML=convText(parseAmt(t.value),IM.f)}
  else if(t.dataset.p){P[t.dataset.p]=parseFloat(t.value)||0;renderProjection();if(!S.flags.planned){S.flags.planned=true;evalChallenges();save();renderTop()}}
  else if(t.id==='ppct'){P.pct=+t.value;renderCut()}
});
document.addEventListener('change',e=>{const t=e.target;
  if(t.id==='fc'){F.cat=t.value;renderTxList()}
  else if(t.id==='pcut'){P.cut=t.value;renderCut()}
  else if(t.id==='sCur'){S.settings.currency=t.value;save();render()}
  else if(t.id==='sRemind'){S.settings.remind=+t.value;checkBills(true);save();toast(+t.value?'Bill reminders on':'Bill reminders off',+t.value?'You will be reminded '+t.selectedOptions[0].text.toLowerCase():'Turn them back on any time here','info')}
  else if(t.id==='bankFile'&&t.files[0]){const r=new FileReader();r.onload=()=>{try{const res=importBankCSV(String(r.result));save();render(true);toast(res.added+' transaction'+(res.added===1?'':'s')+' imported',(res.dup?res.dup+' duplicates skipped. ':'')+'Categories were guessed, check them in Transactions','good');evalChallenges();save()}catch(err){toast('Could not read that file','Export a CSV statement from your bank and try again','bad')}t.value=''};r.readAsText(t.files[0])}
  else if(t.id==='importFile'&&t.files[0]){const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.txns))throw 0;S=Object.assign(fresh(),d,{syncUid:S.syncUid,syncAt:S.syncAt,view:S.view});S.flags.welcomed=true;S.flags.sample=false;save();render();toast('Backup restored',S.txns.length+' transactions loaded','good')}catch(err){toast('Import failed','Choose a Moneyboard backup file (.json)','bad')}};r.readAsText(t.files[0])}
});
document.addEventListener('submit',e=>{
  if(e.target.id==='authForm'){e.preventDefault();authSubmit();return}
  if(e.target.id==='itemForm'){e.preventDefault();const name=$('#iName').value.trim(),cat=$('#iCat').value,amt=parseAmt($('#iAmt').value);if(!name||!(amt>0)){$('#iAmt').focus();return}
    const ex=IM.id&&S.items.find(x=>x.id===IM.id);if(ex){if(ex.name!==name||ex.cat!==cat)ex.key=null;Object.assign(ex,{name,cat,amt,freq:IM.f})}else S.items.push({id:uid(),key:null,cat,name,amt,freq:IM.f});
    $('#itemModal').classList.remove('open');if(cat!=='Income')OPEN.add(cat);commit();toast('Budget item saved',name+': '+money(amt*FREQ[IM.f][1],2)+' a week','good');return}
  if(e.target.id!=='goalForm')return;e.preventDefault();
  const on=document.querySelector('#gIcon .on'),g={id:uid(),name:$('#gName').value.trim(),target:parseFloat($('#gTarget').value),saved:parseFloat($('#gSaved').value)||0,icon:on?on.dataset.i:'flag',color:GOAL_COLS[S.goals.length%GOAL_COLS.length],hit:{}};
  if(!g.name||!(g.target>0))return;[25,50,75,100].forEach(m=>{if(g.saved/g.target*100>=m)g.hit[m]=1});
  S.goals.push(g);const [x,y]=centerOf(e.target.querySelector('button[type=submit]'));confetti(x,y,{n:70,power:.9});toast('Goal created',g.name+' · target '+money(g.target),'good');gainXP(10);commit();
});
document.addEventListener('mouseover',e=>{const s=e.target.closest('.seg');if(!s||!$('#dVal'))return;const [c,v]=s.dataset.tip.split('|');$('#dVal').textContent=money(+v);$('#dLab').textContent=c});
document.addEventListener('mouseout',e=>{if(!e.target.closest('.seg')||!$('#dVal'))return;$('#dVal').textContent=money(totals(S.month).exp);$('#dLab').textContent='Total spent'});
document.addEventListener('keydown',e=>{
  if($('#ach').classList.contains('open')){if(e.key==='Enter'||e.key==='Escape'){e.preventDefault();closeAch()}return}
  if($('#wiz').classList.contains('open')){
    if(e.key==='Enter'){e.preventDefault();if(W.i>=WIZ.length){$('[data-act="wizDone"]').click()}else wizGo(W.i+1,true)}
    else if(e.key==='ArrowDown'){e.preventDefault();if(W.i<WIZ.length)wizGo(W.i+1,true)}
    else if(e.key==='ArrowUp'){e.preventDefault();wizGo(W.i-1,W.i<WIZ.length)}
    else if(e.key==='Escape')wizClose();
    return;
  }
  if(e.key==='Escape'){if(!CONF)$('#authModal').classList.remove('open');$('#modal').classList.remove('open');$('#itemModal').classList.remove('open');$('#npanel').classList.remove('open');$('#msheet').classList.remove('open')}
  if((e.key==='n'||e.key==='N')&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)&&!document.querySelector('.modal.open')){e.preventDefault();openModal()}
});

/* ============ Boot ============ */
const bootRec=runRecurring();recurringNotice(bootRec,true);
checkAlerts(true);evalChallenges(true);save(true);render();renderSync();sbLoad();
document.addEventListener('visibilitychange',()=>{if(document.hidden){if(SB.user&&(S.savedAt||0)>(S.syncAt||0))pushNow();return}const bills=()=>{const c=Object.keys(S.alerted).length;checkBills();if(Object.keys(S.alerted).length!==c){save();render(true)}};if(SB.user){pull().then(bills);return}const n=runRecurring();if(n){recurringNotice(n);commit()}else bills()});
addEventListener('online',()=>{if(SB.user)pull()});
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
setTimeout(()=>{
  if(!S.flags.welcomed&&!S.txns.length&&!S.items.length&&!S.goals.length){$('#welcome').classList.add('open');return}
  if(bootRec)toast(bootRec+' repeating transaction'+(bootRec>1?'s':'')+' logged','Repeating items were added on their due dates','info');
  else{const un=S.notifs.filter(n=>!n.read).length;if(un)toast(un+' unread notification'+(un>1?'s':''),'Open the bell to catch up','info')}
},500);
</script>
