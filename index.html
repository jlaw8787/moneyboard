  if(!e.target.closest('#npanel')&&!e.target.closest('[data-act="bell"]'))$('#npanel').classList.remove('open');
  if(!e.target.closest('[data-act="more"]'))$('#msheet').classList.remove('open');
  const gi=e.target.closest('#gIcon button');if(gi){document.querySelectorAll('#gIcon button').forEach(x=>x.classList.toggle('on',x===gi));return}
  const ft=e.target.closest('[data-ft]');if(ft){F.type=ft.dataset.ft;document.querySelectorAll('[data-ft]').forEach(b=>b.classList.toggle('on',b===ft));renderTxList();return}
  const fq=e.target.closest('#wFreq [data-f],#iFreq [data-f]');if(fq){const box=fq.parentElement;box.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b===fq));if(box.id==='wFreq'){W.f=fq.dataset.f;$('#wConv').innerHTML=convText(parseAmt($('#wAmt').value),W.f);$('#wAmt').focus()}else{IM.f=fq.dataset.f;$('#iConv').innerHTML=convText(parseAmt($('#iAmt').value),IM.f)}return}
  const pr=e.target.closest('[data-per]');if(pr){S.period=pr.dataset.per;save();render(true);return}
  if(e.target.id==='wiz'){wizClose();return}
  if(e.target.id==='ach'){closeAch();return}
  if(e.target.id==='itemModal'){$('#itemModal').classList.remove('open');return}
  if(e.target.id==='authModal'&&!CONF){$('#authModal').classList.remove('open');return}
  if(BD.menu&&!e.target.closest('#bdmenu')&&!e.target.closest('#bdsw')){BD.menu=false;renderBoardSw()}
  const el=e.target.closest('[data-act]');if(!el)return;const a=el.dataset.act;
  if(/^(board|inv|bd)/.test(a)){shareAct(a,el);return}
  if(a==='wizOpen'){wizOpen();return}
  if(a==='gsHide'){S.flags.gsHidden=true;save();render();return}
  if(a==='wizHH'){S.flags.hh=el.dataset.v;W.hh=false;save();wizGo(W.i,false);return}
  if(a==='wizSkipSec'){const g=WIZ[W.i].cat,nx=WIZ.findIndex((x,i)=>i>W.i&&x.cat!==g);wizGo(nx<0?WIZ.length:nx,true);return}
  if(a==='wizFinish'){wizGo(WIZ.length,true);return}
  if(a==='setupDone'){S.flags.setup=true;evalChallenges();save();render();toast('Budget setup marked done','Add or change items any time from Budgets','good');return}
  if(a==='welcomeFresh'){S.flags.welcomed=true;$('#welcome').classList.remove('open');S.view='dashboard';save();render();return}
  if(a==='welcomeDemo'){const fl=S.flags;S=fresh();S.flags=Object.assign(fl,{welcomed:true,sample:true});seed();checkAlerts(true);evalChallenges(true);save();$('#welcome').classList.remove('open');render();toast('Sample data loaded','Clear it any time in Settings when you are ready to start','info');return}
  if(a==='account'){if(SB.user){S.view='settings';save();render();scrollTo({top:0})}else authOpen('in');return}
  if(a==='authOpen'){authOpen(el.dataset.mode||'in');return}
  if(a==='welcomeSignIn'){S.flags.welcomed=true;$('#welcome').classList.remove('open');save();authOpen('in');return}
  if(a==='authClose'){$('#authModal').classList.remove('open');return}
  if(a==='confCloud'&&CONF){$('#authModal').classList.remove('open');adopt(CONF.d,CONF.at);CONF=null;toast('Account data loaded','','good');return}
  if(a==='confLocal'&&CONF){$('#authModal').classList.remove('open');S.syncUid=SB.user.id;S.syncAt=CONF.at;CONF=null;pushNow();toast('This device\'s data saved to your account','','good');return}
  if(a==='syncNow'){pull();return}
  if(a==='signOut'){signOut();return}
  if(a==='snooze'){S.flags.snooze=Date.now()+3*DAY;save();render(true);return}
  if(a==='install'&&installEvt){installEvt.prompt();installEvt.userChoice.finally(()=>{installEvt=null;render(true)});return}
  if(a==='ruleDel'){const r=(S.rules||[]).find(x=>x.id===el.dataset.id);S.rules=S.rules.filter(x=>x.id!==el.dataset.id);save();render(true);if(r)toast('Rule removed',r.match,'info');return}
  if(a==='more'){$('#msheet').classList.toggle('open');return}
  if(a==='txEdit'){if(locked(S.txns,el.dataset.id))return;openModal('edit',el.dataset.id);return}
  if(a==='lockInfo'){const k=el.dataset.kind,x=(S[k]||[]).find(y=>y.id===el.dataset.id);if(x)lockedMsg(x);return}
  if(a==='goalShare'){goalShare(el.dataset.id);return}
  if(a==='sortOpen'){sorterOpen();return}
  if(a==='ruleDel'){S.settings.shareRules=(S.settings.shareRules||[]).filter(r=>r.id!==el.dataset.id);feedChanged('Rule removed','Entries it covered are personal again unless something else shares them');return}
  if(a==='alertsOn'){if(!('Notification' in window))return;Notification.requestPermission().then(async p=>{S.settings.phoneAlerts=p==='granted';save();
    if(p!=='granted'){$('#remindCard').innerHTML=remindCard();toast('Alerts not allowed','You can change this in your browser settings','warn');return}
    const closed=await pushSubscribe();$('#remindCard').innerHTML=remindCard();
    toast('Phone alerts on',closed?'You will get bill alerts even when the app is closed':'You will get a pop-up when a bill is close','good');sysNotify('Phone alerts are on','Bill reminders will show up like this','test')});return}
  if(a==='alertsOff'){S.settings.phoneAlerts=false;save();pushUnsubscribe().then(()=>{$('#remindCard').innerHTML=remindCard()});return}
  if(a==='alertsTest'){if(pushOn()&&SB.client){el.disabled=true;SB.client.functions.invoke('bill-reminders',{body:{test:true}}).then(({data,error})=>{el.disabled=false;if(error||!data||!data.sent)toast('Test did not go through','Turn alerts off and on again, then retry','warn');else toast('Test sent','It can take a few seconds to arrive','good')})}else sysNotify('Test alert','Bill reminders will show up like this','test');return}
  if(a==='spotAdd'||a==='spotFix'||a==='spotNo'){const b=SPOT&&SPOT[+el.dataset.i];if(!b)return;
    if(a==='spotNo'){S.settings.billSkip=[...(S.settings.billSkip||[]),b.k].slice(-200);if(b.twin)toast('Left as it is',b.name+' will not be suggested again','info');else toast('Not a bill',b.name+' will not be suggested again','info')}
    else if(a==='spotAdd'){const bud=trackBill(b,true);toast('Tracking '+b.name,'Next due '+dLabel(b.next)+(bud?', '+bud:''),'good')}
    else{const n=fixTwin(b);toast(b.name+' now tracked from imports',n?n+' doubled-up transaction'+(n===1?'':'s')+' removed':'It will no longer log itself','good')}
    commit();return}
  if(a==='recNew'){openModal('new');$('#fRepeat').value='monthly';return}
  if(a==='recEdit'){if(locked(S.recurring,el.dataset.id))return;openModal('rule',el.dataset.id);return}
  if(a==='recDel'){if(locked(S.recurring,el.dataset.id))return;const r=S.recurring.find(x=>x.id===el.dataset.id);if(r&&r.mkey)S.settings.billSkip=[...(S.settings.billSkip||[]),r.mkey].slice(-200);S.recurring=S.recurring.filter(x=>x.id!==el.dataset.id);save();render(true);if(r)toast('Stopped repeating '+(r.note||r.cat),'Past transactions are kept','info');return}
  if(a==='fDel'){$('#modal').classList.remove('open');if(MM.mode==='rule'){const r=S.recurring.find(x=>x.id===MM.id);S.recurring=S.recurring.filter(x=>x.id!==MM.id);save();render(true);if(r)toast('Stopped repeating '+(r.note||r.cat),'Past transactions are kept','info')}else{delTx(MM.id);save();render(true);toast('Transaction deleted','','info')}return}
  if(a==='achClose'){closeAch();return}
  if(a==='mission'){const m=MISSIONS.find(x=>x.id===el.dataset.id);if(m.act==='add')openModal();else{S.view=m.view;if(m.id==='budget')completeMission('budget',el);save();render();scrollTo({top:0})}return}
  if(a==='wizNext'){wizGo(W.i+1,true);return}
  if(a==='wizSkip'){wizGo(W.i+1,false);return}
  if(a==='wizBack'){wizGo(W.i-1,W.i<WIZ.length);return}
  if(a==='wizJump'){wizGo(+el.dataset.i,true);return}
  if(a==='wizClose'){wizClose();return}
  if(a==='wizDone'){S.flags.setup=true;$('#wiz').classList.remove('open');S.view='budgets';checkAlerts();evalChallenges();save();render();return}
  if(a==='toggleCat'){const c=el.dataset.cat;OPEN.has(c)?OPEN.delete(c):OPEN.add(c);render(true);return}
  if(a==='itemNew'){itemOpen(null,el.dataset.cat);return}
  if(a==='itemEdit'){if(locked(S.items,el.dataset.id))return;itemOpen(el.dataset.id);return}
  if(a==='itemClose'){$('#itemModal').classList.remove('open');return}
  if(a==='itemDel'){if(locked(S.items,el.dataset.id))return;const it=S.items.find(x=>x.id===el.dataset.id);S.items=S.items.filter(x=>x.id!==el.dataset.id);commit();if(it)toast('Removed '+it.name,'','info');return}
  if(a==='nav'){S.view=el.dataset.view;if(S.view==='budgets')completeMission('budget');save();render();scrollTo({top:0})}
  else if(a==='add')openModal();
  else if(a==='closeModal')$('#modal').classList.remove('open');
  else if(a==='report'){S.month=el.dataset.ym;S.view='report';S.flags.rpSeen=el.dataset.ym;save();render();scrollTo({top:0})}
  else if(a==='rpPrint'){window.print()}
  else if(a==='rpCopy'){const tx=reportText(S.month),ok=()=>toast('Summary copied','Paste it into a message or email','good');if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(tx).then(ok).catch(()=>toast('Could not copy','Your browser blocked the clipboard','bad'));else toast('Could not copy','Your browser blocked the clipboard','bad')}
  else if(a==='month'){S.month=shiftYM(S.month,+el.dataset.n);save();render()}
  else if(a==='bell'){const p=$('#npanel');p.classList.toggle('open');if(p.classList.contains('open')){renderNotifs();if(S.notifs.some(n=>!n.read)){S.notifs.forEach(n=>n.read=true);save();$('#bellBtn').innerHTML=ic('bell',18)}}}
  else if(a==='readAll'){S.notifs.forEach(n=>n.read=true);save();renderTop()}
  else if(a==='delTx'){if(locked(S.txns,el.dataset.id))return;delTx(el.dataset.id);save();render(true);toast('Transaction deleted','','info')}
  else if(a==='glOpen'){glOpen(el.dataset.id)}
  else if(a==='glOff'){const g=GL&&S.goals.find(x=>x.id===GL.id);if(g){delete g.link;delete g.lsum;delete g.lcount}$('#authModal').classList.remove('open');save();render(true);if(g)toast(g.name+' unlinked','What it counted so far stays on the goal','info')}
  else if(a==='contrib'){const amt=el.dataset.amt?+el.dataset.amt:parseFloat(($('#c_'+el.dataset.id)||{}).value);contribute(el.dataset.id,amt,el)}
  else if(a==='delGoal'){if(locked(S.goals,el.dataset.id))return;if(el.dataset.armed){S.goals=S.goals.filter(g=>g.id!==el.dataset.id);save();render()}else{el.dataset.armed=1;el.style.width='auto';el.style.padding='0 8px';el.style.color='var(--neg)';el.textContent='Delete?';setTimeout(()=>{if(el.isConnected){delete el.dataset.armed;el.removeAttribute('style');el.innerHTML=ic('x',14)}},3000)}}
  else if(a==='export'){
    const data=JSON.stringify(S,null,1);
    try{const u=URL.createObjectURL(new Blob([data],{type:'application/json'})),l=document.createElement('a');l.href=u;l.download='moneyboard-backup-'+iso(new Date())+'.json';document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),2000)}catch(err){}
    try{navigator.clipboard.writeText(data).then(()=>toast('Backup exported','Downloaded and copied to your clipboard','good'),()=>toast('Backup exported','The backup text is shown below','good'))}catch(err){toast('Backup exported','The backup text is shown below','good')}
    S.flags.backup=true;S.flags.backupAt=Date.now();commit();const b=$('#exportBox');if(b){b.style.display='block';b.value=data}
  }
  else if(a==='demo'){const hasReal=!S.flags.sample&&(S.txns.length||S.items.length||S.goals.length);if(hasReal&&!el.dataset.armed){el.dataset.armed=1;const lb=el.querySelector('span');if(lb)lb.textContent='This replaces your data. Click again';toast('Your data will be replaced','Sample data wipes your own transactions, budget and goals. Export a backup first if you want to keep them','bad');setTimeout(()=>{if(el.isConnected){delete el.dataset.armed;const l2=el.querySelector('span');if(l2)l2.textContent='Reload sample data'}},5000);return}if(hasReal&&S.syncUid){toast('Sign out first','Sample data cannot be loaded while your real data is syncing to your account','bad');return}const keep={xp:S.xp,unlocked:S.unlocked,settings:S.settings,notifs:S.notifs};S=Object.assign(fresh(),keep,{syncUid:S.syncUid,syncAt:S.syncAt});S.flags.welcomed=true;S.flags.sample=true;seed();S.view='dashboard';checkAlerts(true);evalChallenges(true);save();render();toast('Sample data loaded','','info')}
  else if(a==='clear'){if(el.dataset.armed){S=Object.assign(fresh(),{syncUid:S.syncUid,syncAt:S.syncAt});S.flags.welcomed=true;S.flags.since=Date.now();save();render();toast('All data cleared','Add your first transaction to begin','info')}else{el.dataset.armed=1;el.querySelector('span').textContent='Click again to confirm';setTimeout(()=>{if(el.isConnected){delete el.dataset.armed;el.querySelector('span').textContent='Clear all data'}},4000)}}
});
document.addEventListener('input',e=>{const t=e.target;
  if(t.id==='glKey'){const r=document.querySelector('input[name=glk][value=c]');if(r)r.checked=true;glPreview()}
  else if(t.id==='fq'){F.q=t.value;renderTxList()}
  else if(t.id==='wAmt'){$('#wConv').innerHTML=convText(parseAmt(t.value),W.f)}
  else if(t.id==='iAmt'){$('#iConv').innerHTML=convText(parseAmt(t.value),IM.f)}
  else if(t.dataset.p){P[t.dataset.p]=parseFloat(t.value)||0;renderProjection();if(!S.flags.planned){S.flags.planned=true;evalChallenges();save();renderTop()}}
  else if(t.id==='ppct'){P.pct=+t.value;renderCut()}
});
['dragenter','dragover'].forEach(ev=>document.addEventListener(ev,e=>{const z=e.target.closest&&e.target.closest('[data-drop="bank"]');if(!z||!e.dataTransfer||![...e.dataTransfer.types].includes('Files'))return;e.preventDefault();z.classList.add('over')}));
document.addEventListener('dragleave',e=>{const z=e.target.closest&&e.target.closest('[data-drop="bank"]');if(z&&!z.contains(e.relatedTarget))z.classList.remove('over')});
document.addEventListener('drop',e=>{const z=e.target.closest&&e.target.closest('[data-drop="bank"]');if(!z)return;e.preventDefault();z.classList.remove('over');if(e.dataTransfer.files.length)importBankFiles(e.dataTransfer.files)});
document.addEventListener('change',e=>{const t=e.target;
  if(t.id==='fc'){F.cat=t.value;renderTxList()}
  else if(t.id==='pcut'){P.cut=t.value;renderCut()}
  else if(t.id==='sCur'){S.settings.currency=t.value;save();render()}
  else if(t.dataset.ja!=null){const ja=S.settings.jointAccts=S.settings.jointAccts||{},a=t.dataset.ja;if(t.value)ja[a]=t.value;else delete ja[a];
    const n=S.txns.filter(x=>x.acct===a&&shOf('txns',x)).length;feedChanged(t.value?a+' now feeds '+bName(t.value):a+' is personal only',t.value?n+' transaction'+(n===1?'':'s')+' will show on the joint board, plus new imports':'Its transactions come off the joint board')}
  else if(t.dataset.jas!=null){const sp=S.settings.acctSplit=S.settings.acctSplit||{};if(+t.value>=100)delete sp[t.dataset.jas];else sp[t.dataset.jas]=+t.value;feedChanged('Split saved',t.dataset.jas+': '+splitWord(+t.value))}
  else if(t.dataset.ren!=null){const o=t.dataset.ren,nm=t.value.trim().slice(0,40);if(!nm||nm===o){t.value=o;return}let n=0;S.txns.forEach(x=>{if(x.acct===o){x.acct=nm;n++}});
    ['jointAccts','acctSplit','acctBank'].forEach(k=>{const m=S.settings[k];if(m&&m[o]!=null){m[nm]=m[o];delete m[o]}});(S.settings.shareRules||[]).forEach(r=>{if(r.f==='acct'&&r.v===o)r.v=nm});
    const am=S.settings.acctMap||{};Object.keys(am).forEach(k=>{if(am[k]===o)am[k]=nm});feedChanged('Account renamed',n+' transaction'+(n===1?'':'s')+' moved to '+nm)}
  else if(t.id==='rfF'){RF.f=t.value;refreshShareCard()}
  else if(t.dataset.shsel){const w=t.closest('.shfield'),b=w&&w.querySelector('.shsplit');if(b)b.hidden=!t.value}
  else if(t.dataset.shsplit){const w=t.closest('.shsplit'),b=w&&w.querySelector('.shpct');if(b)b.hidden=t.value!=='custom'}
  else if(t.id==='sMyName'){S.settings.myName=t.value.trim().slice(0,24);save();toast('Name saved','Shared entries show as from '+myName(),'good')}
  else if(t.name==='glk'||t.id==='glSince'){glPreview()}
  else if(t.id==='sNotif'){S.settings.notifLevel=t.value;if(t.value!=='all'){S.notifs=S.notifs.filter(n=>!NOTIF_EXTRA[n.cat])}save();$('#remindCard').innerHTML=remindCard();renderTop()}
  else if(t.id==='sRemind'){S.settings.remind=+t.value;checkBills(true);save();toast(+t.value?'Bill reminders on':'Bill reminders off',+t.value?'You will be reminded '+t.selectedOptions[0].text.toLowerCase():'Turn them back on any time here','info')}
  else if(t.id==='bankFile'&&t.files.length){const fs=[...t.files];t.value='';importBankFiles(fs)}
  else if(t.id==='importFile'&&t.files[0]){const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.txns))throw 0;S=Object.assign(fresh(),d,{syncUid:S.syncUid,syncAt:S.syncAt,view:S.view});S.flags.welcomed=true;S.flags.sample=false;save();render();toast('Backup restored',S.txns.length+' transactions loaded','good')}catch(err){toast('Import failed','Choose a Moneyboard backup file (.json)','bad')}};r.readAsText(t.files[0])}
});
document.addEventListener('submit',e=>{
  if(/^bd/.test(e.target.id)){shareSubmit(e);return}
  if(e.target.id==='shRuleForm'){e.preventDefault();const v=(($('#rfV')||{}).value||'').trim();if(!v){toast('Add what the rule should match','','bad');return}
    const r={id:uid(),f:RF.f,v,min:Math.max(0,+$('#rfMin').value||0),b:$('#rfB').value,pct:+$('#rfP').value||100};(S.settings.shareRules=S.settings.shareRules||[]).push(r);
    const n=FEEDK.reduce((a,k)=>a+(S[k]||[]).filter(x=>isObj(x)&&!x.sh&&ruleHit(r,k,x)).length,0);
    feedChanged('Rule added',n+' existing entr'+(n===1?'y':'ies')+' now go to '+bName(r.b));return}
  if(e.target.id==='authForm'){e.preventDefault();authSubmit();return}
  if(e.target.id==='itemForm'){e.preventDefault();const name=$('#iName').value.trim(),cat=$('#iCat').value,amt=parseAmt($('#iAmt').value);if(!name||!(amt>0)){$('#iAmt').focus();return}
    const ex=IM.id&&S.items.find(x=>x.id===IM.id),shE=$('#iShare');let tgt=ex;if(ex){if(ex.name!==name||ex.cat!==cat)ex.key=null;Object.assign(ex,{name,cat,amt,freq:IM.f});delete ex.full}else{tgt={id:uid(),key:null,cat,name,amt,freq:IM.f};S.items.push(tgt)}if(shE)readShare('iShare','items',tgt);
    $('#itemModal').classList.remove('open');if(cat!=='Income')OPEN.add(cat);commit();toast('Budget item saved',name+': '+money(amt*FREQ[IM.f][1],2)+' a week','good');return}
  if(e.target.id==='glForm'){e.preventDefault();const g=GL&&S.goals.find(x=>x.id===GL.id),L=glPick();if(!g)return;if(!L){$('#glErr').textContent='Pick an account or a transfer, or type what the transfers mention';return}
    const before=g.saved;g.link=Object.assign(L,$('#glSince').value==='all'?{}:{since:iso(new Date())});$('#authModal').classList.remove('open');syncGoalLinks();const d=Math.round((g.saved-before)*100)/100;
    toast(g.name+' linked','Follows '+linkLabel(g.link)+(d?'. '+(d>0?'+':'-')+money(Math.abs(d))+' counted':''),'good');save();render(true);return}
  if(e.target.id!=='goalForm')return;e.preventDefault();
  const on=document.querySelector('#gIcon .on'),g={id:uid(),name:$('#gName').value.trim(),target:parseFloat($('#gTarget').value),saved:parseFloat($('#gSaved').value)||0,icon:on?on.dataset.i:'flag',color:GOAL_COLS[S.goals.length%GOAL_COLS.length],hit:{}};
  const gsh=$('#gShare');if(gsh&&gsh.value)g.sh=gsh.value;if(!g.name||!(g.target>0))return;[25,50,75,100].forEach(m=>{if(g.saved/g.target*100>=m)g.hit[m]=1});
  S.goals.push(g);const [x,y]=centerOf(e.target.querySelector('button[type=submit]'));confetti(x,y,{n:70,power:.9});toast('Goal created',g.name+' · target '+money(g.target),'good');gainXP(10);commit();
});
document.addEventListener('mouseover',e=>{const s=e.target.closest('.seg');if(!s||!$('#dVal'))return;const [c,v]=s.dataset.tip.split('|');$('#dVal').textContent=money(+v);$('#dLab').textContent=c});
document.addEventListener('mouseout',e=>{if(!e.target.closest('.seg')||!$('#dVal'))return;$('#dVal').textContent=money(totals(S.month).exp);$('#dLab').textContent='Total spent'});
document.addEventListener('keydown',e=>{
  if($('#ach').classList.contains('open')){if(e.key==='Enter'||e.key==='Escape'){e.preventDefault();closeAch()}return}
  if(SO&&$('#sortModal').classList.contains('open')){if(e.target.tagName==='INPUT'&&e.target.type!=='checkbox')return;if(e.key==='ArrowLeft'){e.preventDefault();if(SO.i<SO.cards.length)soNext('l')}else if(e.key==='ArrowRight'){e.preventDefault();if(SO.i<SO.cards.length)soAccept()}else if(e.key==='Escape'){e.preventDefault();soClose()}return}
  if($('#wiz').classList.contains('open')){
    if(e.key==='Enter'){e.preventDefault();if(W.i>=WIZ.length){$('[data-act="wizDone"]').click()}else wizGo(W.i+1,true)}
    else if(e.key==='ArrowDown'){e.preventDefault();if(W.i<WIZ.length)wizGo(W.i+1,true)}
    else if(e.key==='ArrowUp'){e.preventDefault();wizGo(W.i-1,W.i<WIZ.length)}
    else if(e.key==='Escape')wizClose();
    return;
  }
  if(e.key==='Escape'){if(!CONF)$('#authModal').classList.remove('open');$('#modal').classList.remove('open');$('#itemModal').classList.remove('open');$('#npanel').classList.remove('open');$('#msheet').classList.remove('open')}
  if((e.key==='n'||e.key==='N')&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)&&!document.querySelector('.modal.open')){e.preventDefault();openModal()}
});

/* ============ Boot ============ */
cleanNotifs();const bootRec=runRecurring();recurringNotice(bootRec,true);
checkAlerts(true);evalChallenges(true);save(true);render();renderSync();sbLoad();
document.addEventListener('visibilitychange',()=>{if(document.hidden){if(SB.user&&(S.savedAt||0)>(S.syncAt||0))pushNow();return}const bills=()=>{const c=Object.keys(S.alerted).length;checkBills();if(Object.keys(S.alerted).length!==c){save();render(true)}};if(SB.user){refreshBoards();pull().then(bills);return}const n=runRecurring();if(n){recurringNotice(n);commit()}else bills()});
addEventListener('online',()=>{if(SB.user)pull()});
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
setTimeout(()=>{
  if(!S.flags.welcomed&&!S.txns.length&&!S.items.length&&!S.goals.length){$('#welcome').classList.add('open');return}
  if(bootRec)toast(bootRec+' repeating transaction'+(bootRec>1?'s':'')+' logged','Repeating items were added on their due dates','info');
  else{const un=S.notifs.filter(n=>!n.read).length;if(un)toast(un+' unread notification'+(un>1?'s':''),'Open the bell to catch up','info')}
},500);
</script>
